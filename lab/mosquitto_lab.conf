# Mosquitto broker configuration for the IoT lab (master laptop, 192.168.0.200).
#
# WHY THIS FILE EXISTS
# Mosquitto 2.x, when started with no listener configured (which is what the
# Windows service does with the stock mosquitto.conf), listens on 127.0.0.1
# and ::1 ONLY. The boards (esp32-02 at .160, esp32-03 at .203) and the
# laptop-i3 loop then cannot reach it at all. This file opens port 1883 on
# every interface, so the boards can connect over the lab Wi-Fi via the
# wired router link.
#
# WHY ANONYMOUS
# The firmware (firmware/sensor/sensor.ino), src/scenario.py and the
# laptop-i3 loop all connect without a username or password. Mosquitto 2.x
# refuses anonymous clients unless told otherwise, so this says so explicitly.
# This is acceptable ONLY on the isolated lab router - never use this file on
# a network you do not control.
#
# HOW TO RUN IT (Administrator PowerShell, from the repo root)
#   Stop-Service mosquitto
#   & 'C:\Program Files\mosquitto\mosquitto.exe' -c lab\mosquitto_lab.conf -v
# Ctrl+C stops it; Start-Service mosquitto brings the stock local-only
# service back afterwards.

# All interfaces, port 1883 (no address = bind everywhere, IPv4 and IPv6).
listener 1883

# The boards and scenario.py connect without credentials.
allow_anonymous true

# Nothing worth keeping between runs: the lab's messages are commands and
# telemetry, and a retained "attack" carried over from a previous session
# would re-trigger a board the moment it reconnects. So no persistence file.
persistence false

# Log to the console (with -v: every connect, subscribe and publish).
log_dest stdout
log_type all
connection_messages true
log_timestamp true
log_timestamp_format %H:%M:%S
